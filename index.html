<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator KTA SPKA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Input -->
        <div class="sidebar">
            <h2>Genarator ID Card Anggota SPKA</h2>
            <p class="subtitle"></p>

            <div class="form-group">
                <label for="inputNama">Nama Lengkap</label>
                <input type="text" id="inputNama" value="" placeholder="Masukkan Nama Lengkap">
            </div>

            <div class="form-group">
                <label for="inputNipp">NIPP / No. Anggota</label>
                <input type="text" id="inputNipp" value="" placeholder="Contoh: SPKA 60926">
            </div>
            <div class="button-group">
                <button id="btnJpg" class="btn btn-primary">Unduh (JPG)</button>
                <button id="btnPng" class="btn btn-secondary">Unduh (PNG)</button>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="preview-area">
            <div id="statusMessage" class="status-message">Memuat template ID card...</div>
            <canvas id="idCardCanvas"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
